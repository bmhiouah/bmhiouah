# Realtime RVC V2 starter config — edit paths locally; do not commit weights.

audio:
  sample_rate: 48000
  # Smaller block → lower latency, higher CPU / underrun risk
  block_size: 1024
  channels: 1
  # Leave null to use system default devices; or set integer device ids
  input_device: null
  output_device: null

model:
  # Relative to project root, or absolute path
  # Frida (Hilda) EN — extract with: unzip models/Frida.zip -d models/_tmp/frida/
  path: models/_tmp/frida/frida.pth
  index_path: models/_tmp/frida/added_IVF780_Flat_nprobe_1_frida_v2.index
  # Fallback: Female Pop Star — unzip models/FemalePopStar.zip -d models/_tmp/femalepopstar/
  #   path: models/_tmp/femalepopstar/model.pth
  #   index_path: models/_tmp/femalepopstar/model.index
  # device: cpu | cuda | mps
  device: cpu

runtime:
  # passthrough until real RVC wiring lands in infer_rvc_v2()
  mode: passthrough
