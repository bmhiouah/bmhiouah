# Realtime RVC V2 — edit paths locally; do not commit weights.

audio:
  # Stream defaults to the model sample rate (Frida = 40000). Override via --sr.
  sample_rate: 40000
  # Larger blocks → more stable RVC F0 + CPU headroom (~427 ms @ 48 kHz)
  block_size: 20480
  channels: 1
  # Leave null for auto: AirPods output when connected; built-in/default mic for input
  input_device: null
  output_device: null
  rms_gain: 1.25
  crossfade: 768
  silence_rms: 0.004

model:
  # Relative to project root, or absolute path
  # Frida (Hilda) EN — auto-unzip from models/Frida.zip on first run if missing
  path: models/_tmp/frida/frida.pth
  index_path: models/_tmp/frida/added_IVF780_Flat_nprobe_1_frida_v2.index
  # Shared ContentVec (lj1995 hubert_base.pt → models/hubert/contentvec_hf/)
  hubert_pt: models/hubert/hubert_base.pt
  hubert_hf: models/hubert/contentvec_hf
  # Fallback: Female Pop Star — unzip models/FemalePopStar.zip -d models/_tmp/femalepopstar/
  #   path: models/_tmp/femalepopstar/model.pth
  #   index_path: models/_tmp/femalepopstar/model.index
  # device: cpu | cuda | mps  (realtime default: cpu — more stable than MPS in callback)
  device: cpu
  # 0 = skip FAISS (IVF search has segfaulted with faiss-cpu on macOS/numpy2)
  index_rate: 0
  f0_up_key: 0
  protect: 0.33

runtime:
  mode: rvc_v2
